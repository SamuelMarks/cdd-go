name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Check Go Format
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted properly:"
          echo "$unformatted"
          exit 1
        fi

    - name: Install Dependencies
      run: make install_deps

    - name: Build
      run: make build

    - name: Go Lint (vet)
      run: go vet ./...

    - name: Test
      run: make test

    - name: Check README Coverage Badges
      run: |
        go run scripts/update_badges/update_badges.go
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Download Petstore Specs for Validation
      run: |
        curl -sL https://raw.githubusercontent.com/SamuelMarks/cdd-openapi-test-harness/master/petstore.json -o ../petstore.json
        curl -sL https://raw.githubusercontent.com/SamuelMarks/cdd-openapi-test-harness/master/petstore_oas3.json -o ../petstore_oas3.json

    - name: Swagger 2.0 Petstore test
      run: ./bin/cdd-go from_openapi to_sdk -i ../petstore.json -o my_generated_sdk_swagger

    - name: OpenAPI 3.2.0 Petstore test
      run: ./bin/cdd-go from_openapi to_sdk -i ../petstore_oas3.json -o my_generated_sdk_oas3

    - name: Build WASM
      run: make build_wasm

    - name: Install binaryen
      if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      run: sudo apt-get update && sudo apt-get install -y binaryen

    - name: Optimize WASM
      if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      run: |
        for f in bin/*.wasm; do
          if [ -f "$f" ]; then
            wasm-opt -O3 "$f" -o "$f" || true
          fi
        done

    - name: Build Docker Alpine
      run: docker build -t cdd-go:alpine -f alpine.Dockerfile .

    - name: Build Docker Debian
      run: docker build -t cdd-go:debian -f debian.Dockerfile .

    - name: Update latest tag
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag -f latest
        git push origin -f latest

    - name: Upload Artifacts
      if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        files: |
          bin/cdd-go
          bin/cdd-go.wasm
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
