name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      petstore_jvm:
        image: swaggerapi/petstore
        ports:
          - 8080:8080
      petstore_jvm_oas3:
        image: openapitools/openapi-petstore
        ports:
          - 8081:8080
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Check Go Format
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted properly:"
          echo "$unformatted"
          exit 1
        fi

    - name: Install Dependencies
      run: make install_deps

    - name: Build
      run: make build

    - name: Go Lint (vet)
      run: go vet ./...

    - name: Test
      run: make test

    - name: Check README Coverage Badges
      run: |
        go run scripts/update_badges/update_badges.go
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Download Petstore Specs for Validation
      run: |
        curl -sL https://raw.githubusercontent.com/SamuelMarks/cdd-openapi-test-harness/master/petstore.json -o ../petstore.json
        curl -sL https://raw.githubusercontent.com/SamuelMarks/cdd-openapi-test-harness/master/petstore_oas3.json -o ../petstore_oas3.json

    - name: Swagger 2.0 Petstore test
      run: ./bin/cdd-go from_openapi to_sdk -i ../petstore.json -o my_generated_sdk_swagger

    - name: OpenAPI 3.2.0 Petstore test
      run: ./bin/cdd-go from_openapi to_sdk -i ../petstore_oas3.json -o my_generated_sdk_oas3

    - name: Swagger 2.0 Petstore server test
      run: ./bin/cdd-go from_openapi to_server -i ../petstore.json -o my_generated_server_swagger --tests

    - name: OpenAPI 3.2.0 Petstore server test
      run: ./bin/cdd-go from_openapi to_server -i ../petstore_oas3.json -o my_generated_server_oas3 --tests

    - name: Build WASM
      run: make build_wasm

    - name: Install binaryen
      if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      run: sudo apt-get update && sudo apt-get install -y binaryen

    - name: Optimize WASM
      if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      run: |
        for f in bin/*.wasm; do
          if [ -f "$f" ]; then
            wasm-opt -O3 "$f" -o "$f" || true
          fi
        done

    - name: Build Docker Alpine
      run: docker build -t cdd-go:alpine -f alpine.Dockerfile .

    - name: Build Docker Debian
      run: docker build -t cdd-go:debian -f debian.Dockerfile .

    - name: Upload Artifacts (Version Tag)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        artifacts: "bin/cdd-go,bin/cdd-go.wasm"
        allowUpdates: true
        replacesArtifacts: true

    - name: Update latest tag
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git push origin :refs/tags/latest || true
        git tag -fa latest -m "Update latest tag to match ${GITHUB_REF_NAME}"
        git push origin latest

    - name: Upload Artifacts (Latest Tag)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: ncipollo/release-action@v1
      with:
        artifacts: "bin/cdd-go,bin/cdd-go.wasm"
        allowUpdates: true
        replacesArtifacts: true
        tag: latest
        name: latest
        makeLatest: true
